plugins {
    id "fabric-loom" version "1.9-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
}

def targetMc = project.findProperty("target_mc") ?: project.minecraft_version

def targetYarn = project.findProperty("target_yarn") ?: project.yarn_mappings

def targetLoader = project.findProperty("target_loader") ?: project.loader_version

def targetFabric = project.findProperty("target_fabric") ?: project.fabric_version

def targetSuffix = targetMc.replace('.', '_')

base {
    archivesName = "afkshots-${project.mod_version}+mc${targetMc}"
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMc}"
    mappings "net.fabricmc:yarn:${targetYarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${targetLoader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${targetFabric}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

// Usage:
// ./gradlew build -Ptarget_mc=1.21.4 -Ptarget_yarn=1.21.4+build.1 -Ptarget_loader=0.16.9 -Ptarget_fabric=0.106.0+1.21.4
